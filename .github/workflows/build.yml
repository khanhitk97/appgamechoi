name: Build EmergencyVN IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cai dat Python va sinh Database SQLite
        run: |
          python3 build_db.py

      - name: Cai dat XcodeGen
        run: brew install xcodegen

      - name: Sinh Xcode Project tu project.yml
        run: xcodegen generate

      - name: Build Archive (Skip Code Signing)
        run: |
          xcodebuild clean archive \
            -project EmergencyVN.xcodeproj \
            -scheme EmergencyVN \
            -configuration Release \
            -archivePath "build/EmergencyVN.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Dong goi thanh IPA
        run: |
          mkdir Payload
          cp -r build/EmergencyVN.xcarchive/Products/Applications/*.app Payload/
          zip -r -y EmergencyVN.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmergencyVN-IPA
          path: EmergencyVN.ipa
          retention-days: 7
